http:
  addr: ":8080"
  base_url: ${LAGENT_BASE_URL:-http://localhost:8080}
  cookie_secret: ${LAGENT_COOKIE_SECRET}
auth:
  bootstrap_key: ${LAGENT_BOOTSTRAP_KEY}
store:
  driver: mongo
  uri: mongodb://mongo:27017/?replicaSet=rs0
redis:
  addr: redis:6379
object:
  driver: s3
  bucket: lagent-artifacts
  region: us-east-1
  endpoint: http://minio:9000
secret:
  path: /home/lagent/secrets.enc
  key: ${LAGENT_SECRET_KEY}
llm:
  default: anthropic/claude-opus-5-5
  providers:
    anthropic: { api_key: "${ANTHROPIC_API_KEY}", concurrency: 8 }
record_llm_calls: true
