# Local stack: MongoDB (replica set), Redis, MinIO, and lagent split into roles.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate().ok }"]
      interval: 5s
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lagent
      MINIO_ROOT_PASSWORD: lagent-secret
    ports: ["9000:9000", "9001:9001"]
  api:
    build: ../..
    command: ["serve", "--config", "/etc/lagent/lagent.yaml", "--roles", "api"]
    volumes: ["./lagent.yaml:/etc/lagent/lagent.yaml:ro"]
    env_file: [.env]
    ports: ["8080:8080"]
    depends_on: [mongo, redis, minio]
  engine:
    build: ../..
    command: ["serve", "--config", "/etc/lagent/lagent.yaml", "--roles", "engine,worker"]
    volumes: ["./lagent.yaml:/etc/lagent/lagent.yaml:ro"]
    env_file: [.env]
    deploy: { replicas: 2 }
    depends_on: [mongo, redis, minio]
